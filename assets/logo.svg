<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="title description">
  <title id="title">proton-mail</title>
  <desc id="description">A lavender envelope with a floating letter, softly twinkling stars, and a mint typing bubble.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#211939"/>
      <stop offset="1" stop-color="#100e20"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#9062ff" stop-opacity=".27"/>
      <stop offset="1" stop-color="#9062ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x2=".8" y2="1">
      <stop stop-color="#d5c6ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#d5c6ff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="inside" x2="0" y2="1">
      <stop stop-color="#b398ff"/>
      <stop offset="1" stop-color="#6746ba"/>
    </linearGradient>
    <linearGradient id="paper" x2=".7" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#e7ddff"/>
    </linearGradient>
    <linearGradient id="envelope" x2="1" y2="1">
      <stop stop-color="#c4acff"/>
      <stop offset=".5" stop-color="#9973ef"/>
      <stop offset="1" stop-color="#7049d6"/>
    </linearGradient>
    <linearGradient id="fold" x2=".8" y2="1">
      <stop stop-color="#c7b0ff"/>
      <stop offset="1" stop-color="#8c63e4"/>
    </linearGradient>
    <linearGradient id="mint" x2=".6" y2="1">
      <stop stop-color="#effffb"/>
      <stop offset="1" stop-color="#a9ead8"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#090519" flood-opacity=".38"/>
    </filter>
    <filter id="soft-shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#392263" flood-opacity=".2"/>
    </filter>
    <path id="star" d="M0-13C2-4 4-2 13 0 4 2 2 4 0 13-2 4-4 2-13 0-4-2-2-4 0-13Z"/>
  </defs>
  <style>
    .envelope { animation: float 6s ease-in-out infinite; }
    .letter { animation: letter 6s ease-in-out infinite; }
    .bubble { animation: bubble 6s ease-in-out infinite; }
    .sparkle { animation: twinkle 6s ease-in-out infinite; }
    .sparkle-late { animation-delay: -3s; }
    .dot { animation: typing 1.8s ease-in-out infinite; }
    .dot-two { animation-delay: -.6s; }
    .dot-three { animation-delay: -1.2s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes letter { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes bubble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
    @keyframes twinkle { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .envelope, .letter, .bubble, .sparkle, .dot { animation: none; }
    }
  </style>

  <rect x="16.5" y="12.5" width="447" height="335" rx="36" fill="url(#background)" stroke="url(#rim)"/>
  <ellipse cx="236" cy="177" rx="210" ry="163" fill="url(#halo)"/>
  <g fill="none" stroke="#bd9dff">
    <ellipse cx="240" cy="185" rx="182" ry="110" transform="rotate(-20 240 185)" stroke-opacity=".12"/>
    <ellipse cx="240" cy="185" rx="153" ry="132" transform="rotate(24 240 185)" stroke-opacity=".06"/>
  </g>
  <g fill="#bca5f2">
    <circle cx="81" cy="186" r="2" opacity=".45"/>
    <circle cx="284" cy="53" r="2" opacity=".5"/>
    <circle cx="396" cy="202" r="2.5" opacity=".6"/>
    <circle cx="168" cy="303" r="2" opacity=".4"/>
    <circle cx="376" cy="276" r="1.5" opacity=".3"/>
  </g>
  <ellipse cx="239" cy="294" rx="97" ry="12" fill="#080612" opacity=".24"/>

  <g class="envelope">
    <g filter="url(#shadow)">
      <path d="M126 161Q126 151 135 145L225 87Q240 77 255 87L345 145Q354 151 354 161V258Q354 274 338 274H142Q126 274 126 258Z" fill="url(#inside)" stroke="#d4bfff" stroke-opacity=".5"/>
      <path d="m135 153 99 69q6 4 12 0l99-69" fill="none" stroke="#503480" stroke-opacity=".3"/>
      <g class="letter">
        <g transform="rotate(-6 240 171)">
          <rect x="165" y="104" width="151" height="143" rx="13" fill="url(#paper)" filter="url(#soft-shadow)"/>
          <rect x="181" y="120" width="30" height="30" rx="9" fill="#ede6ff"/>
          <path d="m188 135 5 5 11-12" fill="none" stroke="#8a63d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="223" y="125" width="62" height="5" rx="2.5" fill="#9582ba"/>
          <rect x="223" y="137" width="43" height="4" rx="2" fill="#c5b8dd"/>
          <rect x="183" y="168" width="111" height="5" rx="2.5" fill="#c7b8e4"/>
          <rect x="183" y="182" width="95" height="5" rx="2.5" fill="#d7cceb"/>
          <rect x="183" y="196" width="66" height="5" rx="2.5" fill="#d7cceb"/>
        </g>
      </g>
      <path d="M126 155 240 225 354 155V258Q354 274 338 274H142Q126 274 126 258Z" fill="url(#envelope)"/>
      <path d="m127 157 86 60-82 47q-5-4-5-12Z" fill="#decaff" opacity=".17"/>
      <path d="m353 157-86 60 82 47q5-4 5-12Z" fill="#5632ae" opacity=".13"/>
      <path d="m132 267 94-66q14-9 28 0l94 66q-4 7-13 7H145q-9 0-13-7Z" fill="url(#fold)"/>
      <path d="m135 266 92-64q13-8 26 0l92 64" fill="none" stroke="#e5d5ff" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M127 160v97q0 16 16 16h194q16 0 16-16v-97" fill="none" stroke="#dfccff" stroke-opacity=".35"/>
    </g>
  </g>

  <g transform="translate(354 94)">
    <g class="sparkle" fill="#eadfff">
      <use href="#star" transform="scale(1.25)"/>
      <use href="#star" transform="translate(20 -20) scale(.35)" opacity=".7"/>
    </g>
  </g>
  <g transform="translate(107 113)">
    <use class="sparkle sparkle-late" href="#star" fill="#c7b0ff" transform="scale(.65)"/>
  </g>
  <g transform="translate(105 250)">
    <use class="sparkle" href="#star" fill="#bcf4e3" transform="scale(.4)"/>
  </g>

  <g class="bubble">
    <path d="M316 233h60q14 0 14 14v22q0 14-14 14h-43l-15 11v-11h-2q-14 0-14-14v-22q0-14 14-14Z" fill="url(#mint)" stroke="#edfff9" stroke-opacity=".8" filter="url(#soft-shadow)"/>
    <g fill="#448b7a">
      <circle class="dot" cx="329" cy="258" r="4"/>
      <circle class="dot dot-two" cx="346" cy="258" r="4"/>
      <circle class="dot dot-three" cx="363" cy="258" r="4"/>
    </g>
  </g>
</svg>
